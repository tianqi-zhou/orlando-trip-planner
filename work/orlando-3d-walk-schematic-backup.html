</style></head><body><header><div><h1>奥兰多 · 3D 行走路线</h1><a href="orlando-park-guide.html#maps" style="font-size:13px">← 返回完整攻略</a></div><div class="days" id="days"><button data-day="0" aria-pressed="true">第一天 · Epic</button><button data-day="1" aria-pressed="false">第二天 · 环球双园</button><button data-day="2" aria-pressed="false">第三天 · Disney</button></div></header>
<main><div id="stage"><div class="hud"><b id="location">入口</b><small id="instruction">拖动旋转 · 滚轮缩放 · 点击右侧站点跳转</small></div><div class="controls"><button id="play">▶ 开始行走</button><button id="reset">回到起点</button><select id="view" aria-label="视角"><option value="orbit">俯视全景</option><option value="follow">跟随小人</option><option value="eye">行人视角</option></select><input id="progress" aria-label="行走进度" type="range" min="0" max="1000" value="0"><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></div><div id="error"></div></div><aside><h2 id="dayTitle"></h2><p id="dayNote"></p><div id="stops"></div><div class="legend"><p><span class="tag">蓝线</span>步行示意 <span class="tag">金线</span>跨园交通</p><p>这是自制 3D 示意模型：建筑用简化体量与标志性轮廓表示，并非官方 3D 资产或实景复刻。地块位置、距离和步道已简化，不能作逐步导航。</p><p>路线沿用攻略推荐顺序，不随攻略中的个人勾选自动变化。播放时长不代表实际步行时间。</p><p>哈利波特区域保留完整队列；下雨或项目停运时，按当天 App 调整。</p></div></aside></main>
<script src="assets/three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);if(!window.THREE){$('error').style.display='block';$('error').textContent='3D 组件未加载，请保留旁边的 assets 文件夹后重新打开。';return}
const T=THREE,stage=$('stage');let renderer;try{renderer=new T.WebGLRenderer({antialias:true})}catch(e){$('error').style.display='block';$('error').textContent='当前浏览器未能启用 WebGL，请在支持 3D 的浏览器打开此页面。';return}renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.prepend(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#b9d8e9');scene.fog=new T.Fog('#b9d8e9',220,520);const camera=new T.PerspectiveCamera(48,1,.1,800);scene.add(new T.HemisphereLight(0xe5f5ff,0x7a8973,2.6));const sun=new T.DirectionalLight(0xffefd9,3);sun.position.set(-60,150,90);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-190,right:190,top:160,bottom:-160});scene.add(sun);let world=new T.Group();scene.add(world);let actor,labels=[],stops=[],segments=[],total=1,progress=0,playing=false,day=0,angle=.12,elevation=.87,zoom=200,drag=null;
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.82});function box(parent,x,y,z,w,h,d,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}function cylinder(parent,x,y,z,r,h,c,top=r){const m=new T.Mesh(new T.CylinderGeometry(top,r,h,20),mat(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}function label(text,x,y,z){const c=document.createElement('canvas');c.width=640;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#102338ec';ctx.beginPath();ctx.roundRect(0,0,640,96,18);ctx.fill();ctx.font='bold 31px sans-serif';ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,320,48,610);const tex=new T.CanvasTexture(c),sp=new T.Sprite(new T.SpriteMaterial({map:tex,depthTest:false}));sp.position.set(x,y,z);sp.scale.set(34,5.1,1);sp.renderOrder=10;world.add(sp);labels.push(sp)}
function landmark(x,z,type,name,color='#e5c998'){const g=new T.Group();g.position.set(x,0,z);world.add(g);if(type==='sphere'){cylinder(g,0,0,0,5,4,'#d7dbdf');const s=new T.Mesh(new T.IcosahedronGeometry(10,2),mat('#d1dce4'));s.position.y=14;s.castShadow=true;g.add(s)}else if(type==='castle'){box(g,0,0,0,18,15,10,color);for(const a of [-10,10]){cylinder(g,a,0,0,3,24,color);cylinder(g,a,24,0,3.7,7,'#4b6676',0)}box(g,0,15,0,7,12,6,color);cylinder(g,0,27,0,5,7,'#4b6676',0)}else if(type==='mountain'){for(let i=0;i<4;i++)cylinder(g,(i-1.5)*5,0,(i%2)*4,8,18+i*4,color,0)}else if(type==='tower'){box(g,0,0,0,15,26,12,color);box(g,-6,26,0,5,8,6,color);box(g,6,26,0,5,8,6,color);for(let h=5;h<25;h+=5)for(let x=-4;x<=4;x+=4)box(g,x,h,6.1,1.5,2,.3,'#294451')}else if(type==='dome'){box(g,0,0,0,21,7,15,color);const d=new T.Mesh(new T.SphereGeometry(8,24,12,0,Math.PI*2,0,Math.PI/2),mat('#6d9c9d'));d.position.y=7;g.add(d)}else if(type==='coaster'){box(g,0,0,0,15,5,8,color);const points=[];for(let i=0;i<=60;i++){const a=i/60*Math.PI*2;points.push(new T.Vector3(Math.cos(a)*16,8+Math.sin(a*3)*5,Math.sin(a)*10))}const tube=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(points),100,.55,6,false),mat('#dd8450'));g.add(tube);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;cylinder(g,Math.cos(a)*16,0,Math.sin(a)*10,.35,8+Math.sin(a*3)*5,'#748b9b')}}else{box(g,0,0,0,20,9,12,color);box(g,0,9,0,22,2,14,'#557483');for(let x=-7;x<=7;x+=7)box(g,x,2,6.1,3,5,.3,'#7595a2')}
label(name,x,type==='tower'?42:type==='castle'?41:type==='sphere'?30:32,z);return g}
function line(a,b,color,r=.7){const delta=new T.Vector3().subVectors(b,a),m=new T.Mesh(new T.CylinderGeometry(r,r,delta.length(),8),mat(color));m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());world.add(m)}
const datasets=[{title:'9/10 · Epic Universe',note:'由中央公园进入各主题区。先看魔法部完整队列，再按天气处理室外过山车。',sites:[[-48,-45,'castle','Dark Universe','#8f929a'],[48,-45,'dome','魔法部 · 巴黎','#dfc8b0'],[-58,28,'mountain','Nintendo · 矿车','#80ad67'],[58,28,'mountain','Berk · 驯龙高手','#8a9b8b'],[20,65,'coaster','Stardust Racers','#bed8d1'],[0,5,'dome','Celestial Park','#cfdfcf']],route:[['入口',0,93,'入园先确认 Battle 状态'],['魔法部',35,-20,'Battle 完整队列与巴黎街景'],['Stardust',20,80,'室外过山车，雷雨前优先'],['Nintendo',-42,42,'矿车 → Mario Kart'],['Dark Universe',-35,-22,'Monsters + Das Stakehaus 正餐'],['Berk',43,45,'Hiccup + 驯龙舞台秀'],['中央夜景',0,50,'有余力再二刷 Stardust']]},
{title:'9/11 · 环球一日双园',note:'USF 上午做核心，搭 Hogwarts Express 到 IOA，再沿园区边缘回出口。',sites:[[85,43,'hall','USF 入口','#e4bd98'],[80,-5,'hall','Mummy · 木乃伊','#c6b293'],[55,-58,'hall','Diagon Alley','#aeb4bc'],[-5,-58,'castle','Hogsmeade','#b8b0a1'],[-52,-36,'coaster','VelociCoaster','#aabca5'],[-80,12,'mountain','Skull Island','#8b9884'],[-65,62,'coaster','Marvel · Hulk','#7ea98e']],route:[['USF 入口',95,68,'从入口前往 New York'],['Mummy',95,10,'木乃伊，随后去对角巷'],['Diagon Alley',65,-38,'古灵阁完整队列 + 破釜酒吧'],['Hogwarts Express',5,-38,'列车跨园；必须 Park-to-Park','train'],['Hogsmeade',-15,-36,'Forbidden Journey 与 Hagrid'],['Jurassic',-45,-13,'VelociCoaster，雨停优先'],['Skull / Toon',-57,22,'Kong 或顺路通过'],['Marvel',-43,63,'Spider-Man / Hulk'],['IOA 出口',-15,84,'出园后 CityWalk 晚餐']]},
{title:'9/12 · Disney 三园精选',note:'三个园以分区模型压缩展示；金色连线是交通，实际园区并不紧邻。',sites:[[-97,-5,'mountain','Pandora · FOP','#88b4a1'],[-65,-48,'dome','Discovery Island','#bfa684'],[-43,-9,'mountain','Everest','#b5b7b4'],[0,-65,'sphere','EPCOT 正门'],[30,-37,'hall','Guardians / Test Track','#c6d3de'],[0,18,'hall','World Showcase','#dcc5a5'],[92,15,'tower','Tower of Terror','#c1a38d'],[88,-47,'mountain',"Galaxy’s Edge",'#c8b99d']],route:[['AK 入口',-80,45,'进入 Pandora'],['Pandora',-90,18,'FOP + Satu’li，按餐厅开门时间调整'],['Discovery / Asia',-57,-23,'Zootopia / Everest SR'],['AK 巴士站',-68,46,'返回园门，等车'],['EPCOT 正门',0,-43,'跨园巴士，预留 45–60 分钟','bus'],['Guardians / Test Track',24,-12,'按 Lightning Lane 时段调整顺序'],['World Showcase',0,40,'顺路小吃；Remy 有 LL 才加'],['HS 入园',65,55,'International Gateway → Skyliner，经 Caribbean Beach 换乘','cable'],['Sunset Boulevard',80,37,'Tower + 过山车'],['Galaxy’s Edge',80,-23,'Rise + Docking Bay 7，室内休息']]}
];
function disposeWorld(){world.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}});scene.remove(world);world=new T.Group();scene.add(world);labels=[]}
function loadDay(i){day=i;playing=false;progress=0;angle=.12;zoom=i===2?240:215;disposeWorld();const data=datasets[i];$('dayTitle').textContent=data.title;$('dayNote').textContent=data.note;document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.day)===i));box(world,0,-2,5,270,2,225,'#7ea991');for(const s of data.sites)landmark(...s);for(let n=0;n<48;n++){const x=Math.sin(n*17.13)*125,z=Math.cos(n*8.8)*102;if(data.sites.some(s=>Math.hypot(x-s[0],z-s[1])<22))continue;cylinder(world,x,0,z,.7,3,'#8f7761');cylinder(world,x,3,z,3,7,'#427865',0)}stops=data.route.map(r=>({name:r[0],p:new T.Vector3(r[1],.6,r[2]),note:r[3],mode:r[4]||'walk'}));segments=[];total=0;for(let n=1;n<stops.length;n++){const a=stops[n-1].p,b=stops[n].p,len=a.distanceTo(b);segments.push({a,b,len,start:total,stop:n});total+=len;line(a,b,stops[n].mode==='walk'?'#2b75ee':'#edb957',1.1)}stops.forEach((s,n)=>{cylinder(world,s.p.x,0,s.p.z,2.3,.3,'#fff3c9');label((n+1)+' · '+s.name,s.p.x,7,s.p.z)});actor=new T.Group();box(actor,0,1,0,1.3,2,.8,'#ff664f');cylinder(actor,0,3,0,.65,1,'#ffe0bd');box(actor,-.4,0,0,.45,1.2,.5,'#173c5c');box(actor,.4,0,0,.45,1.2,.5,'#173c5c');world.add(actor);$('stops').innerHTML=stops.map((s,n)=>`<button class="stop" data-stop="${n}">${n+1}. ${s.name}<small>${s.note}</small></button>`).join('');$('play').textContent='▶ 开始行走';$('progress').value=0;updatePosition();}
function positionAt(t){const distance=Math.min(t,.999999)*total,seg=segments.find(s=>distance<s.start+s.len)||segments.at(-1);return {p:seg.a.clone().lerp(seg.b,(distance-seg.start)/seg.len),seg}}
function updatePosition(){const {p,seg}=positionAt(progress);actor.position.copy(p);const direction=seg.b.clone().sub(seg.a).normalize();actor.rotation.y=Math.atan2(direction.x,direction.z);const stop=stops[seg.stop];$('location').textContent=(stop.mode==='walk'?'步行 → ':stop.mode==='train'?'列车 → ':stop.mode==='bus'?'巴士 → ':'缆车 → ')+stop.name;$('instruction').textContent=stop.note;document.querySelectorAll('[data-stop]').forEach(b=>b.classList.toggle('active',Number(b.dataset.stop)===seg.stop));const mode=$('view').value;actor.visible=mode!=='eye';labels.forEach(s=>{s.visible=mode==='orbit'||s.position.distanceTo(p)<60});if(mode==='orbit'){camera.position.set(Math.sin(angle)*zoom,Math.sin(elevation)*zoom,Math.cos(angle)*zoom*Math.cos(elevation));camera.lookAt(0,0,5)}else{const dist=mode==='eye'?0:13,target=p.clone().addScaledVector(direction,-dist);target.y=mode==='eye'?4.4:12;camera.position.lerp(target,.12);const look=p.clone().addScaledVector(direction,18);look.y=mode==='eye'?4.4:2;camera.lookAt(look)} }
$('days').onclick=e=>{const b=e.target.closest('[data-day]');if(b)loadDay(Number(b.dataset.day))};$('play').onclick=()=>{if(progress>=1)progress=0;playing=!playing;$('play').textContent=playing?'Ⅱ 暂停':'▶ 继续行走'};$('reset').onclick=()=>{progress=0;playing=false;$('progress').value=0;$('play').textContent='▶ 开始行走';updatePosition()};$('progress').oninput=e=>{progress=Number(e.target.value)/1000;updatePosition()};$('stops').onclick=e=>{const b=e.target.closest('[data-stop]');if(!b)return;const n=Number(b.dataset.stop);progress=n===0?0:(segments[n-1].start+segments[n-1].len)/total;progress=Math.min(progress,1);$('progress').value=progress*1000;updatePosition()};stage.addEventListener('pointerdown',e=>{if(e.target!==renderer.domElement)return;drag=[e.clientX,e.clientY];stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;angle-=(e.clientX-drag[0])*.006;elevation=Math.max(.3,Math.min(1.4,elevation+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY]});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);stage.addEventListener('wheel',e=>{if(e.target!==renderer.domElement)return;e.preventDefault();zoom=Math.max(70,Math.min(360,zoom+e.deltaY*.15))},{passive:false});new ResizeObserver(()=>{renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}).observe(stage);loadDay(0);let prev=performance.now();function frame(now){const dt=Math.min((now-prev)/1000,.1);prev=now;if(playing){progress=Math.min(1,progress+dt*.008*Number($('speed').value));$('progress').value=progress*1000;if(progress===1){playing=false;$('play').textContent='↻ 再走一次'}actor.children[2].rotation.x=Math.sin(now*.012)*.25;actor.children[3].rotation.x=-Math.sin(now*.012)*.25}updatePosition();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
